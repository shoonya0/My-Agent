# MyAgent full local stack: infrastructure + Go services.
# Prerequisites: copy config.env.example to config.env and set OPENAI_API_KEY, JWT_SECRET, ENCRYPTION_KEY.
#
# Usage:
#   docker compose build
#   docker compose up -d
#   docker compose logs -f api-gateway
#
# Hot reload (Go toolchain in container, repo bind-mounted):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up api-gateway
#

x-myagent-app: &myagent_app
  env_file:
    - config.env
  networks:
    - myagent
  restart: unless-stopped
  environment:
    MYSQL_DSN: myagent:myagent@tcp(mysql:3306)/myagent?parseTime=true
    REDIS_ADDR: redis:6379
    KAFKA_BROKERS: kafka:29092
    AUTH_SERVICE_ADDR: auth-service:9090
    JAEGER_ENDPOINT: jaeger:4317
    API_GATEWAY_PORT: "8080"
    AUTH_SERVICE_PORT: "8082"
    GRPC_PORT: "9090"
    ORCHESTRATOR_PORT: "9091"
    APPROVAL_SERVICE_PORT: "8086"
    AWS_ENDPOINT: http://minio:9000
    AWS_ACCESS_KEY_ID: minioadmin
    AWS_SECRET_ACCESS_KEY: minioadmin_dev_only
    AWS_BUCKET: myagent
    AWS_REGION: us-east-1
    COMFYUI_BASE_URL: http://host.docker.internal:8188

networks:
  myagent:
    driver: bridge

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
  minio_data:

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: myagent-zookeeper
    restart: unless-stopped
    networks: [myagent]
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: myagent-kafka
    restart: unless-stopped
    networks: [myagent]
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 40s

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    networks: [myagent]
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic prompt.refine.requested --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic prompt.refined --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic image.generated --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic image.approved --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic job.failed --partitions 3 --replication-factor 1

  mysql:
    image: mysql:8.0
    container_name: myagent-mysql
    restart: unless-stopped
    networks: [myagent]
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword_change_me
      MYSQL_DATABASE: myagent
      MYSQL_USER: myagent
      MYSQL_PASSWORD: myagent
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword_change_me"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    container_name: myagent-redis
    restart: unless-stopped
    networks: [myagent]
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: myagent-minio
    restart: unless-stopped
    networks: [myagent]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_dev_only
    volumes:
      - minio_data:/data
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    networks: [myagent]
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin_dev_only
        mc mb -p local/myagent || true

  jaeger:
    image: jaegertracing/all-in-one:1.62
    container_name: myagent-jaeger
    restart: unless-stopped
    networks: [myagent]
    ports:
      - "16686:16686"
      - "4317:4317"
      - "14268:14268"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: myagent-prometheus
    restart: unless-stopped
    networks: [myagent]
    ports:
      - "9095:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  grafana:
    image: grafana/grafana:11.3.0
    container_name: myagent-grafana
    restart: unless-stopped
    networks: [myagent]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin_change_me
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health | grep -q ok"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --- Go application services ------------------------------------------------

  auth-service:
    <<: *myagent_app
    build:
      context: .
      dockerfile: deploy/docker/auth-service/Dockerfile
    container_name: myagent-auth-service
    ports:
      - "9090:9090"
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  orchestrator:
    <<: *myagent_app
    build:
      context: .
      dockerfile: deploy/docker/orchestrator/Dockerfile
    container_name: myagent-orchestrator
    ports:
      - "9091:9091"
    depends_on:
      mysql:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  api-gateway:
    <<: *myagent_app
    build:
      context: .
      dockerfile: deploy/docker/api-gateway/Dockerfile
    container_name: myagent-api-gateway
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      jaeger:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  prompt-agent:
    <<: *myagent_app
    build:
      context: .
      dockerfile: deploy/docker/prompt-agent/Dockerfile
    container_name: myagent-prompt-agent
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  image-gen-agent:
    <<: *myagent_app
    build:
      context: .
      dockerfile: deploy/docker/image-gen-agent/Dockerfile
    container_name: myagent-image-gen-agent
    depends_on:
      minio-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  approval-service:
    <<: *myagent_app
    build:
      context: .
      dockerfile: deploy/docker/approval-service/Dockerfile
    container_name: myagent-approval-service
    ports:
      - "8086:8086"
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  distribution-service:
    <<: *myagent_app
    build:
      context: .
      dockerfile: deploy/docker/distribution-service/Dockerfile
    container_name: myagent-distribution-service
    depends_on:
      mysql:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
