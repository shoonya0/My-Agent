# Lightweight stack for integration / CI tests (no app containers).
# Usage:
#   docker compose -f docker-compose.test.yml up -d
#   # run tests against localhost:3307 (MySQL), localhost:6380 (Redis), localhost:9094 (Kafka)
#   docker compose -f docker-compose.test.yml down -v
#
# Optional: set COMPOSE_PROJECT_NAME=myagent-test to avoid clashing with dev volumes.

networks:
  myagent_test:
    driver: bridge

volumes:
  mysql_test_data:

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    networks: [myagent_test]
    ports:
      - "2182:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    networks: [myagent_test]
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9094:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test:
        [
          "CMD",
          "kafka-broker-api-versions",
          "--bootstrap-server",
          "localhost:9092",
        ]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 40s

  mysql:
    image: mysql:8.0
    networks: [myagent_test]
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: testroot
      # Must match deploy/mysql/init/01-schema.sql (USE myagent)
      MYSQL_DATABASE: myagent
      MYSQL_USER: myagent
      MYSQL_PASSWORD: myagent
    volumes:
      - mysql_test_data:/var/lib/mysql
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-ptestroot",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    networks: [myagent_test]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  jaeger:
    image: jaegertracing/all-in-one:1.62
    networks: [myagent_test]
    ports:
      - "16687:16686"
      - "4318:4317"
