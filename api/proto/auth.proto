syntax = "proto3";

package auth.v1;

option go_package = "myAgent/api/authpb";

// AuthService is the internal gRPC service used by api-gateway for
// authentication operations: token validation and user registration.
service AuthService {
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc Register(RegisterUserRequest) returns (TokenResponse);
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  string user_id = 1;
  repeated string roles = 2;
  int64 expires_at = 3;
}

message RegisterUserRequest {
  string email = 1;
  string password = 2;
  string display_name = 3;
}

message TokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  int32 expires_in = 3;
  string token_type = 4;
}
