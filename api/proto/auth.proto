syntax = "proto3";

package auth.v1;

option go_package = "myAgent/api/authpb";

// AuthService is the internal gRPC service used by api-gateway for
// authentication operations: token validation, registration, session management,
// and OAuth callback processing.
service AuthService {
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc Register(RegisterUserRequest) returns (TokenResponse);
  rpc Login(LoginRequest) returns (TokenResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc HandleOAuthCallback(OAuthCallbackRequest) returns (TokenResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (TokenResponse);
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  string user_id = 1;
  repeated string roles = 2;
  int64 expires_at = 3;
}

message RegisterUserRequest {
  string email = 1;
  string password = 2;
  string display_name = 3;
}

message TokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  int32 expires_in = 3;
  string token_type = 4;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LogoutRequest {
  string token = 1;
  // Optional: when provided, the refresh token JTI is blacklisted (best-effort).
  string refresh_token = 2;
}

message LogoutResponse {
  bool success = 1;
}

message OAuthCallbackRequest {
  string provider = 1;
  string code = 2;
  string state = 3;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}
