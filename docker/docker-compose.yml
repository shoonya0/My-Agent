name: myagent

# MyAgent infrastructure services: Redis, Kafka, MySQL, Jaeger, MinIO
# Usage from repo root:
#   docker compose up -d
#   docker compose ps
#   docker compose logs -f
#
# Or explicitly:
#   docker compose -f docker/docker-compose.yml up -d
#
# Stop services:
#   docker compose down
#
# Stop and remove data volumes:
#   docker compose down -v

networks:
  myagent:
    driver: bridge

volumes:
  mysql_data:
  minio_data:

services:
  # ============================================================================
  # INFRASTRUCTURE SERVICES
  # ============================================================================

  # --- Redis ----------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: myagent-redis
    restart: unless-stopped
    networks: [myagent]
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # --- Kafka + Zookeeper ----------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: myagent-zookeeper
    restart: unless-stopped
    networks: [myagent]
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: myagent-kafka
    restart: unless-stopped
    networks: [myagent]
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test:
        [
          "CMD",
          "kafka-broker-api-versions",
          "--bootstrap-server",
          "localhost:9092",
        ]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 40s

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    networks: [myagent]
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic prompt.refine.requested --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic prompt.refined --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic image.generated --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic image.approved --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic job.failed --partitions 3 --replication-factor 1

  # --- MySQL ----------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: myagent-mysql
    restart: unless-stopped
    networks: [myagent]
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword_change_me
      MYSQL_DATABASE: myagent
      MYSQL_USER: myagent
      MYSQL_PASSWORD: myagent
    volumes:
      - mysql_data:/var/lib/mysql
      - ../deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-prootpassword_change_me",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # --- Jaeger ---------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: myagent-jaeger
    restart: unless-stopped
    networks: [myagent]
    ports:
      - "16686:16686"
      - "4317:4317"
      - "14268:14268"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  # --- MinIO ----------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: myagent-minio
    restart: unless-stopped
    networks: [myagent]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_dev_only
    volumes:
      - minio_data:/data
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    networks: [myagent]
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin_dev_only
        mc mb -p local/myagent || true
